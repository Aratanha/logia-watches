<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="navyDial" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b3358" />
      <stop offset="65%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#060d1a" />
    </radialGradient>
    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3dfb2" />
      <stop offset="45%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#8f6d2c" />
    </linearGradient>
  </defs>

  <!-- Minimal Sculpted Lugs -->
  <path d="M18 11 L23 3 L26 9 Z" fill="url(#goldBezel)" />
  <path d="M44 11 L39 3 L36 9 Z" fill="url(#goldBezel)" />
  <path d="M18 53 L23 61 L26 55 Z" fill="url(#goldBezel)" />
  <path d="M44 53 L39 61 L36 55 Z" fill="url(#goldBezel)" />

  <!-- 3 O'Clock Fluted Winding Crown -->
  <rect x="56" y="26.5" width="5.5" height="11" rx="2" fill="url(#goldBezel)" stroke="#060d1a" stroke-width="0.8" />
  <line x1="57.2" y1="29" x2="60.5" y2="29" stroke="#060d1a" stroke-width="0.7" />
  <line x1="57.2" y1="32" x2="60.5" y2="32" stroke="#060d1a" stroke-width="0.7" />
  <line x1="57.2" y1="35" x2="60.5" y2="35" stroke="#060d1a" stroke-width="0.7" />

  <!-- Outer Gold Case & Bezel -->
  <circle cx="31" cy="32" r="26.5" fill="url(#goldBezel)" stroke="#060d1a" stroke-width="1" />
  <circle cx="31" cy="32" r="23" fill="url(#navyDial)" stroke="#dfc184" stroke-width="0.9" />

  <!-- Inner Chapter Ring -->
  <circle cx="31" cy="32" r="19.5" fill="none" stroke="#f7f5f0" stroke-opacity="0.22" stroke-width="0.6" />

  <!-- 4 Cardinal Indices (Gold Triangle at 12, Off-White Batons at 3, 6, 9) -->
  <polygon points="31,15.5 28.2,11 33.8,11" fill="#dfc184" />
  <rect x="47.5" y="30.6" width="5" height="2.8" rx="1" fill="#f7f5f0" />
  <rect x="29.6" y="48.5" width="2.8" height="5" rx="1" fill="#f7f5f0" />
  <rect x="9.5" y="30.6" width="5" height="2.8" rx="1" fill="#f7f5f0" />

  <!-- Dauphine Hands Set to 10:10 -->
  <!-- Hour Hand (10 o'clock) -->
  <polygon points="31,32 28.5,34.2 17.5,23.5 32.8,29.5" fill="#fcfbf9" stroke="#060d1a" stroke-width="0.5" />
  <!-- Minute Hand (2 o'clock / 10 min) -->
  <polygon points="31,32 29.2,29.5 44.5,19.5 33.2,34.2" fill="#fcfbf9" stroke="#060d1a" stroke-width="0.5" />

  <!-- Gold Center Pinion Cap -->
  <circle cx="31" cy="32" r="3" fill="url(#goldBezel)" stroke="#060d1a" stroke-width="0.7" />
  <circle cx="31" cy="32" r="1" fill="#060d1a" />
</svg>
